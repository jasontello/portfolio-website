<!DOCTYPE html>
<html lang="en" class="is-content-fullscreen">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./style.css?v=alignment-grid-2" />

    <title>Music | Jason Tello Portfolio</title>

    <link rel="icon" type="image/png" href="./images/favicon-head.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  </head>
  <body class="music-body is-content-fullscreen locked-content-fullscreen">
    <main class="main-content music-page" aria-labelledby="music-title">
      <header class="site-header">
        <a class="site-header__brand" href="./index.html" aria-label="Jason Tello home">Jason Tello</a>
        <nav class="site-header__nav" aria-label="Primary navigation">
          <a class="nav-link-fx" href="./index.html">Work</a>
          <button class="nav-link-fx resume-trigger" type="button" aria-haspopup="dialog" aria-controls="resume-modal" aria-expanded="false">Resume</button>
          <a class="nav-link-fx nav-link-fx--active" href="./music.html" aria-current="page">Music</a>
          <a class="nav-link-fx" href="./design-system.html">Style Guide</a>
        </nav>
      </header>

      <section class="music-gallery" aria-label="Music">
        <div class="music-gallery__header">
          <div>
            <h2 id="music-title">Music</h2>
            <p>Music I'm currently listening to.</p>
          </div>
          <span>Spotify</span>
        </div>

        <div class="music-panel">
          <section class="music-shelf" aria-label="Top tracks on a CD shelf">
            <div class="music-shelf-player" data-spotify-shelf-player>
              <div class="music-shelf-player__top">
                <div>
                  <p class="music-panel__label">Shelf selection</p>
                  <h3 data-spotify-shelf-title>Loading shelf selection...</h3>
                  <p data-spotify-shelf-meta></p>
                </div>
                <a href="https://open.spotify.com/" target="_blank" rel="noreferrer" data-spotify-shelf-link>Open in Spotify</a>
              </div>
              <iframe
                data-spotify-shelf-embed
                title="Spotify player"
                loading="lazy"
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                allowfullscreen>
              </iframe>
            </div>
            <div class="music-shelf__scene">
              <img class="music-shelf__image" src="./images/music/shelf.png" alt="" aria-hidden="true">
              <div class="music-shelf__cases" data-spotify-shelf-cases>
                <p class="music-shelf__status">Loading recent tracks...</p>
              </div>
            </div>
          </section>

          <section class="spotify-board" aria-labelledby="currently-listening-title">
            <div class="listening-board__top">
              <div>
                <p class="music-panel__label">Currently listening</p>
                <h3 id="currently-listening-title">Top 10 tracks lately</h3>
              </div>
              <a class="spotify-board__link" href="https://open.spotify.com/playlist/1WnuBR8G38niNAKLAfQ8XO?si=3dd2e893e48e4f96" target="_blank" rel="noreferrer">Open playlist</a>
            </div>

            <div class="top-tracks" data-spotify-top-tracks>
              <p class="top-tracks__status">Loading recent tracks...</p>
            </div>
          </section>
        </div>
      </section>
    </main>

    <section class="resume-modal" id="resume-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="resume-modal-title" hidden>
      <div class="resume-modal__backdrop" data-resume-close></div>
      <div class="resume-modal__panel">
        <header class="resume-modal__header">
          <div>
            <p class="resume-modal__eyebrow">Resume</p>
            <h2 id="resume-modal-title">Jason Tello</h2>
          </div>
          <div class="resume-modal__actions">
            <a class="resume-modal__download" href="./documents/Jason_Tello_Resume.pdf" target="_blank" rel="noreferrer">Open PDF</a>
            <button class="resume-modal__close" type="button" aria-label="Close resume" data-resume-close>Close</button>
          </div>
        </header>
        <iframe class="resume-modal__frame" src="about:blank" data-resume-src="./documents/Jason_Tello_Resume.pdf#view=FitH" title="Jason Tello resume"></iframe>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="./script.js?v=site-header-1"></script>
    <!-- Cloudflare Web Analytics -->
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"b487877912b34d169c3745d5bd3cfb90"}'></script>
    <!-- End Cloudflare Web Analytics -->
  </body>
</html>
